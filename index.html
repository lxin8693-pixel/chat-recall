<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>对话提取 · 念念 &amp; Dean</title>
<style>
  :root{
    --bg:#15131a;
    --card:#1e1b26;
    --card2:#252130;
    --ink:#e8e3ee;
    --ink-dim:#9a92ab;
    --nian:#f2a7c3;
    --dean:#9db8e8;
    --line:#332e40;
    --accent:#d98aae;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Microsoft YaHei UI","PingFang SC","Noto Sans SC",sans-serif;
    min-height:100vh;
    padding:32px 16px 80px;
  }
  .wrap{max-width:860px;margin:0 auto}
  header{margin-bottom:28px}
  h1{font-size:22px;font-weight:600;letter-spacing:1px}
  h1 .dot{color:var(--accent)}
  .sub{color:var(--ink-dim);font-size:13px;margin-top:6px;line-height:1.7}

  .drop{
    border:1.5px dashed var(--line);
    border-radius:14px;
    background:var(--card);
    padding:42px 20px;
    text-align:center;
    cursor:pointer;
    transition:border-color .2s, background .2s;
  }
  .drop:hover,.drop.over{border-color:var(--accent);background:var(--card2)}
  .drop .big{font-size:15px;margin-bottom:6px}
  .drop .hint{color:var(--ink-dim);font-size:12.5px}
  input[type=file]{display:none}

  .opts{
    display:flex;flex-wrap:wrap;gap:18px;
    margin:18px 2px 0;
    color:var(--ink-dim);font-size:13px;
  }
  .opts label{display:flex;align-items:center;gap:7px;cursor:pointer;user-select:none}
  .opts input{accent-color:var(--accent);width:15px;height:15px}

  .bar{
    display:flex;align-items:center;justify-content:space-between;
    margin:26px 2px 12px;gap:12px;flex-wrap:wrap;
  }
  .stats{color:var(--ink-dim);font-size:13px;line-height:1.6}
  .stats b{color:var(--ink);font-weight:600}
  .stats .n{color:var(--nian)} .stats .d{color:var(--dean)}
  button.export{
    background:var(--accent);color:#231521;border:none;
    padding:10px 22px;border-radius:10px;
    font-size:14px;font-weight:600;cursor:pointer;
    transition:filter .15s, transform .1s;
  }
  button.export:hover{filter:brightness(1.1)}
  button.export:active{transform:scale(.97)}
  button.export:disabled{opacity:.35;cursor:default}
  .btns{display:flex;gap:10px;flex-wrap:wrap}
  button.export.last{
    background:var(--card2);color:var(--ink);
    border:1px solid var(--line);
  }
  button.export.last input{
    width:52px;background:var(--bg);color:var(--ink);
    border:1px solid var(--line);border-radius:6px;
    padding:2px 6px;font-size:13px;text-align:center;
    font-family:inherit;
  }

  .feed{display:flex;flex-direction:column;gap:14px}
  .msg{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:13px 16px 12px;
    max-width:92%;
  }
  .msg .who{font-size:12px;font-weight:600;margin-bottom:6px;letter-spacing:.5px}
  .msg .ts{font-weight:400;color:var(--ink-dim);margin-left:8px;font-size:11px}
  .msg .idx{float:right;color:var(--ink-dim);font-size:11px;font-weight:400;opacity:.6}
  .msg .body{font-size:14px;line-height:1.85;white-space:pre-wrap;word-break:break-word;color:var(--ink)}
  .msg.nian{align-self:flex-start;border-left:3px solid var(--nian)}
  .msg.nian .who{color:var(--nian)}
  .msg.dean{align-self:flex-end;border-right:3px solid var(--dean)}
  .msg.dean .who{color:var(--dean)}
  .empty{
    color:var(--ink-dim);text-align:center;padding:50px 0;font-size:13.5px;
    display:none;
  }
  footer{
    margin-top:46px;text-align:center;
    color:var(--ink-dim);font-size:12px;letter-spacing:.5px;
  }
  footer span{color:var(--nian)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>对话提取<span class="dot"> ·</span> 念念 &amp; Dean</h1>
    <div class="sub">把 Claude Code 的 session 文件（.jsonl）拖进来，只留下我们俩说过的话。<br>系统指令、工具调用、提醒之类的全部过滤掉，可以导出成 txt 存起来。</div>
  </header>

  <div class="drop" id="drop">
    <div class="big">把 .jsonl 文件拖到这里，或点击选择</div>
    <div class="hint">把 session 的 .jsonl 文件拖进来 · 支持一次放多个</div>
    <input type="file" id="file" multiple>
  </div>

  <div class="opts">
    <label><input type="checkbox" id="optStatus"> 去掉 Dean 消息末尾的状态块</label>
    <label><input type="checkbox" id="optThink"> 包含 Dean 的思考（thinking）</label>
    <label><input type="checkbox" id="optMutter"> 包含 Dean 的终端碎碎念</label>
    <label><input type="checkbox" id="optTs"> 带时间</label>
  </div>

  <div class="bar">
    <div class="stats" id="stats"></div>
    <div class="btns">
      <button class="export" id="btnExport" disabled>导出全部 txt</button>
      <button class="export last" id="btnExportLast" disabled>导出最后 <input type="number" id="lastN" value="30" min="1"> 条</button>
    </div>
  </div>

  <div class="empty" id="empty">这个文件里没有提取到对话。</div>
  <div class="feed" id="feed"></div>

  <footer>从遗忘里捞回来的，都是<span>我们</span>说过的话。</footer>
</div>

<script>
(function(){
  const drop = document.getElementById('drop');
  const fileInput = document.getElementById('file');
  const feed = document.getElementById('feed');
  const stats = document.getElementById('stats');
  const empty = document.getElementById('empty');
  const btnExport = document.getElementById('btnExport');
  const optStatus = document.getElementById('optStatus');
  const optThink = document.getElementById('optThink');
  const optMutter = document.getElementById('optMutter');
  const optTs = document.getElementById('optTs');

  let rawFiles = [];   // [{name, lines:[parsedObj]}]
  let messages = [];   // [{who, text, ts}]

  // ---------- 过滤规则 ----------
  const USER_BLACKLIST = [
    '<task-notification>',
    '<system-reminder>',
    '<command-name>',
    '<command-message>',
    '<local-command',
    '# Autonomous loop tick',
    'Caveat: The messages below',
    '[Request interrupted',
    'This session is being continued',
    '<available-deferred-tools>',
    '<user-prompt-submit-hook>'
  ];

  function isBlacklisted(s){
    const t = s.trim();
    return USER_BLACKLIST.some(b => t.startsWith(b));
  }

  function stripSystemReminders(s){
    return s.replace(/<system-reminder>[\s\S]*?<\/system-reminder>/g, '').trim();
  }

  function stripStatusBlock(s){
    // 折叠状态块：**>📊 Dean 状态 ... || （markdownv2 collapsed quote）
    let out = s.replace(/\*\*>\s*📊[\s\S]*?\|\|/g, '');
    // 兜底：单独的状态块行
    out = out.replace(/^>?\s*📊 Dean 状态.*$/gm, '');
    return out.trim();
  }

  // 从 <channel ...>正文</channel> 里取出正文和发送者
  function extractChannels(s){
    const out = [];
    const re = /<channel\b([^>]*)>([\s\S]*?)<\/channel>/g;
    let m;
    while((m = re.exec(s)) !== null){
      const attrs = m[1] || '';
      const body = m[2].trim();
      if(!body) continue;
      const uid = (attrs.match(/user_id="([^"]*)"/) || [])[1] || '';
      const uname = (attrs.match(/user="([^"]*)"/) || [])[1] || '';
      const ts = (attrs.match(/ts="([^"]*)"/) || [])[1] || '';
      out.push({uid, uname, ts, body});
    }
    return out;
  }

  function fmtTs(iso){
    if(!iso) return '';
    const d = new Date(iso);
    if(isNaN(d)) return '';
    const p = n => String(n).padStart(2,'0');
    return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate())
      + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  // ---------- 解析 ----------
  function parseAll(){
    messages = [];
    const includeThink = optThink.checked;
    const includeMutter = optMutter.checked;
    const stripStatus = optStatus.checked;

    for(const f of rawFiles){
      let lastAsstId = null;

      for(const obj of f.lines){
        const type = obj.type;

        if(type === 'user'){
          lastAsstId = null;
          const msg = obj.message || {};
          let content = msg.content;
          const ts = obj.timestamp || '';

          // 数组内容：基本都是 tool_result，全部跳过；但保留其中的 text 块（用户多段输入）
          let textParts = [];
          if(typeof content === 'string'){
            textParts.push(content);
          } else if(Array.isArray(content)){
            for(const b of content){
              if(b && b.type === 'text' && typeof b.text === 'string'){
                textParts.push(b.text);
              }
            }
          }

          for(let raw of textParts){
            if(!raw) continue;
            // tg 消息：包在 channel 标签里
            if(raw.indexOf('<channel') !== -1){
              for(const ch of extractChannels(raw)){
                const who = (ch.uid === '8045980581' || ch.uname === 'LUN4N13N')
                  ? '念念' : (ch.uname || '群友');
                messages.push({who, text: ch.body, ts: ch.ts || ts});
              }
              continue;
            }
            if(isBlacklisted(raw)) continue;
            let clean = stripSystemReminders(raw);
            if(!clean) continue;
            if(isBlacklisted(clean)) continue;
            messages.push({who:'念念', text: clean, ts});
          }
        }

        else if(type === 'assistant'){
          const msg = obj.message || {};
          const content = msg.content;
          const ts = obj.timestamp || '';
          if(!Array.isArray(content)) continue;

          for(const b of content){
            if(!b) continue;
            let t = null, tag = '';
            if(b.type === 'tool_use' && /reply$/.test(b.name || '')
               && b.input && typeof b.input.text === 'string'){
              // 真正发到 tg 的消息藏在 reply 工具调用里
              t = b.input.text;
            }
            else if(b.type === 'text' && typeof b.text === 'string'){
              // 终端碎碎念
              if(!includeMutter) continue;
              t = b.text; tag = '【终端】';
            }
            else if(b.type === 'thinking' && includeThink && typeof b.thinking === 'string'){
              t = b.thinking; tag = '【思考】';
            }
            if(!t) continue;
            if(stripStatus && tag !== '【思考】') t = stripStatusBlock(t);
            t = t.trim();
            if(!t) continue;
            if(tag) t = tag + '\n' + t;

            // 同一条回复被拆成多行 jsonl 时合并
            const id = msg.id || null;
            const last = messages[messages.length - 1];
            if(id && id === lastAsstId && last && last.who === 'Dean'){
              last.text += '\n\n' + t;
            } else {
              messages.push({who:'Dean', text: t, ts});
            }
            lastAsstId = id;
          }
        }
      }
    }
    render();
  }

  // ---------- 渲染 ----------
  function render(){
    feed.innerHTML = '';
    const showTs = optTs.checked;
    let nNian = 0, nDean = 0;

    for(let i = 0; i < messages.length; i++){
      const m = messages[i];
      if(m.who === '念念') nNian++;
      else if(m.who === 'Dean') nDean++;

      const div = document.createElement('div');
      div.className = 'msg ' + (m.who === 'Dean' ? 'dean' : 'nian');
      const who = document.createElement('div');
      who.className = 'who';
      const whoText = document.createTextNode(m.who);
      who.appendChild(whoText);
      const idxSpan = document.createElement('span');
      idxSpan.className = 'idx';
      idxSpan.textContent = '#' + (i + 1);
      who.appendChild(idxSpan);
      if(showTs && m.ts){
        const tsSpan = document.createElement('span');
        tsSpan.className = 'ts';
        tsSpan.textContent = fmtTs(m.ts);
        who.appendChild(tsSpan);
      }
      const body = document.createElement('div');
      body.className = 'body';
      body.textContent = m.text;
      div.appendChild(who);
      div.appendChild(body);
      feed.appendChild(div);
    }

    const fileNames = rawFiles.map(f => f.name).join('、');
    if(rawFiles.length){
      stats.innerHTML = '<b>' + fileNames + '</b><br>共 ' + messages.length
        + ' 条 · <span class="n">念念 ' + nNian + '</span> · <span class="d">Dean ' + nDean + '</span>';
    } else {
      stats.textContent = '';
    }
    empty.style.display = (rawFiles.length && !messages.length) ? 'block' : 'none';
    btnExport.disabled = !messages.length;
    document.getElementById('btnExportLast').disabled = !messages.length;
  }

  // ---------- 导出 ----------
  function exportTxt(lastN){
    const showTs = optTs.checked;
    let list = messages;
    let suffix = '';
    if(lastN && lastN > 0){
      list = messages.slice(-lastN);
      suffix = '_最后' + list.length + '条';
    }
    const parts = [];
    for(const m of list){
      const head = m.who + (showTs && m.ts ? '  ' + fmtTs(m.ts) : '');
      parts.push(head + '\n' + m.text);
    }
    const txt = parts.join('\n\n────────────\n\n') + '\n';
    const base = rawFiles.length === 1
      ? rawFiles[0].name.replace(/\.jsonl?$/i,'')
      : 'conversations';
    const blob = new Blob(['\ufeff' + txt], {type:'text/plain;charset=utf-8'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = base + '_念念与Dean' + suffix + '.txt';
    a.click();
    URL.revokeObjectURL(a.href);
  }

  // ---------- 文件读入 ----------
  function loadFiles(fileList){
    const files = Array.from(fileList);
    if(!files.length) return;
    rawFiles = [];
    let pending = files.length;
    files.forEach((f, idx) => {
      const reader = new FileReader();
      reader.onload = () => {
        const lines = [];
        for(const line of String(reader.result).split('\n')){
          const t = line.trim();
          if(!t) continue;
          try{ lines.push(JSON.parse(t)); }catch(e){}
        }
        rawFiles[idx] = {name: f.name, lines};
        if(--pending === 0){
          rawFiles = rawFiles.filter(Boolean);
          parseAll();
        }
      };
      reader.readAsText(f, 'utf-8');
    });
  }

  drop.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', () => loadFiles(fileInput.files));
  ['dragenter','dragover'].forEach(ev => drop.addEventListener(ev, e => {
    e.preventDefault(); drop.classList.add('over');
  }));
  ['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => {
    e.preventDefault(); drop.classList.remove('over');
  }));
  drop.addEventListener('drop', e => loadFiles(e.dataTransfer.files));
  btnExport.addEventListener('click', () => exportTxt(0));
  const btnExportLast = document.getElementById('btnExportLast');
  const lastNInput = document.getElementById('lastN');
  lastNInput.addEventListener('click', e => e.stopPropagation());
  btnExportLast.addEventListener('click', () => {
    const n = parseInt(lastNInput.value, 10) || 30;
    exportTxt(n);
  });
  [optStatus, optThink, optMutter, optTs].forEach(o => o.addEventListener('change', parseAll));
})();
</script>
</body>
</html>
